workflows:
  android-debug:
    name: Android verification and debug APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Check and build
        script: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/reports/**
      - app/build/test-results/**/*.xml
  android-release:
    name: Manually triggered signed release
    max_build_duration: 60
    environment:
      java: 17
      android_signing:
        - iphonedialer_release
    scripts:
      - name: Reuse permanent signing identity
        script: |
          export ANDROID_KEYSTORE_PATH="$CM_KEYSTORE_PATH"
          export ANDROID_KEYSTORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export ANDROID_KEY_ALIAS="$CM_KEY_ALIAS"
          export ANDROID_KEY_PASSWORD="$CM_KEY_PASSWORD"
          bash scripts/require-signing.sh
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintRelease assembleRelease bundleRelease --no-daemon
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/mapping/release/mapping.txt
