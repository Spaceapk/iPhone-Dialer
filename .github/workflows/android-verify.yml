name: Android verification
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install project SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests, lint and unsigned release
        run: bash gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha04-verification-unsigned
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/release/*unsigned.apk
